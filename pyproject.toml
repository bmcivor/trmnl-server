[project]
name = "trmnl-server"
version = "0.1.0"
description = "Self-hosted BYOS server showing Claude Code usage on an e-ink panel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Blake McIvor" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
keywords = ["trmnl", "byos", "eink", "epaper", "claude-code", "usage"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pillow==12.3.0",
    "orjson==3.12.0",
]

[project.urls]
Homepage = "https://github.com/bmcivor/trmnl-server"
Repository = "https://github.com/bmcivor/trmnl-server"
Issues = "https://github.com/bmcivor/trmnl-server/issues"

[project.scripts]
trmnl-server = "trmnl_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trmnl_server"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "G"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
